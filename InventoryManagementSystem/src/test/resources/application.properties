# =====================================================================
#  Test configuration
#
#  The automated tests run against an in-memory H2 database in
#  PostgreSQL compatibility mode. That keeps `mvn test` runnable with no
#  external service - on a laptop, in CI, and during grading.
#
#  Flyway is disabled here and Hibernate generates the schema instead.
#  The migrations are PostgreSQL-specific (functional unique indexes on
#  lower(column), partial indexes, COMMENT ON CONSTRAINT) and are meant
#  to be verified against PostgreSQL, not against H2. See README section 6
#  for how to run the migrations against a real database.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Deterministic accounts for @WithMockUser-free integration tests.
app.security.users[0].username=field
app.security.users[0].password=field123
app.security.users[0].role=FIELD
app.security.users[1].username=manager
app.security.users[1].password=manager123
app.security.users[1].role=MANAGER
app.security.users[2].username=finance
app.security.users[2].password=finance123
app.security.users[2].role=FINANCE
app.security.users[3].username=admin
app.security.users[3].password=admin123
app.security.users[3].role=ADMIN
app.security.allowed-origins[0]=http://localhost:5500

logging.level.org.springframework.security=WARN
