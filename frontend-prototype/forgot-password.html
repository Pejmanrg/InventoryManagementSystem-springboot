<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">

<body>
<noscript>
  <div class="alert alert--warning" style="margin:24px">
    <div class="alert__body">This page requires JavaScript.</div>
  </div>
</noscript>

<div class="login">
  <aside class="login__aside">
    <h2>We will email you a link to set a new password.</h2>
    <p>
      The link works once and expires after an hour. Your current password keeps
      working until you use it.
    </p>
  </aside>

  <main class="login__panel">
    <div class="login__form" id="panel"></div>
  </main>
</div>

<div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modalRoot"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>

</body>
</html>
