server {
    # Cloud Run routes to 8080. nginx's default is 80, so this must be set.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The prototype is multi-page (dashboard.html, assets.html, ...), not a
    # single-page app, so a missing file is a genuine 404 rather than a route
    # to hand back to a client-side router. Falling back to index.html only
    # for a bare directory request keeps that distinction honest.
    location / {
        try_files $uri $uri/ =404;
    }

    # Never cache the JavaScript: api.js carries the API base URL and the
    # demo credential, and a stale cached copy after a redeploy is a
    # confusing failure to debug.
    location ~* \.js$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Static assets can be cached briefly.
    location ~* \.(css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Basic hardening for a publicly reachable page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
